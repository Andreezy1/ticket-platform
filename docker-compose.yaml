

services:
  postgres:
    image: postgres:17
    container_name: ticket-platform-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/auth/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}",
        "up"
      ]

  ticket-platform-auth:
    build: ./services/auth
    container_name: ticket-platform-auth
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "127.0.0.1:6060:6060"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          cpus: '2'      
          memory: 1024M     

volumes:
    postgres_data:
    